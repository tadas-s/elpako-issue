[project]
name = "elpako-issue"
version = "0.1.0"
description = "Demonstration of Elpako signature forwarding"
authors = [
    {name = "Tadas Sasnauskas",email = "tadas@yoyo.lt"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-cors (>=6.0.2,<7.0.0)"
]

[tool.poetry]
packages = [{include = "elpako_issue", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
elpako_issue_forwarder = 'elpako_issue.forwarder:run'
elpako_issue_signer = 'elpako_issue.signer:run'
